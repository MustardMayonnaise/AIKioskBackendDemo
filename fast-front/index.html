<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app">
      <section class="card reveal">
        <h1>Chat</h1>

        <div class="row controls">
          <button id="startChatRecordButton" type="button">녹음 시작</button>
          <button id="stopChatRecordButton" type="button" disabled>녹음 중지</button>
          <button id="sendChatRecordButton" type="button" disabled>녹음 전송</button>
        </div>

        <div class="row">
          <label for="chatAudioFileInput" class="file-label">오디오 업로드</label>
          <input id="chatAudioFileInput" type="file" accept="audio/*" />
          <button id="sendChatFileButton" type="button" disabled>전송</button>
        </div>

        <audio id="chatAudioPreview" controls></audio>

        <label for="chatJsonResult">응답</label>
        <textarea id="chatJsonResult" rows="18" readonly placeholder="Chat 응답이 여기에 표시됩니다."></textarea>
      </section>

      <section class="card reveal delay-1">
        <h2>상태</h2>
        <p id="statusText">대기 중</p>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
